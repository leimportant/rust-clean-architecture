[package]
name = "project-rust_starter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }

axum = "0.7"
tower-http = { version = "0.5", features = ["trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

once_cell = "1.19"
regex = "1"

async-trait = "0.1"
dotenvy = "0.15"
thiserror = "1"

tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

validator = { version = "0.16", features = ["derive"] }
argon2 = "0.5.3"
password-hash = "0.5.0"
rand_core = "0.9.5"
tower-cookies = "0.11.0"

[dependencies.sqlx]
version = "0.7"

features = [
  "runtime-tokio",
  "any",
  "mysql",
  "postgres"
]

